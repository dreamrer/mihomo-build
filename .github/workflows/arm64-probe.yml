name: Windows ARM64 TUN probe

# 一次性实验(2026-11-07):Windows ARM 电脑(Snapdragon X 等)上,x64 版内核靠系统模拟能不能开 TUN?
# 驱动不能模拟,x64 的 wintun 很可能装不上。用官方开源 mihomo + 公开的 wintun 实测,不用任何密钥。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build mihomo (amd64 + arm64) and fetch wintun
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "OS arch: $env:PROCESSOR_ARCHITECTURE"
          git clone -q --depth 1 --branch v1.19.33 https://github.com/MetaCubeX/mihomo.git src
          Push-Location src
          foreach ($a in 'amd64', 'arm64') {
            $env:GOOS = 'windows'; $env:GOARCH = $a; $env:CGO_ENABLED = '0'
            go build -tags with_gvisor -trimpath -o "..\core-$a.exe" .
          }
          Pop-Location
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt
          Get-ChildItem core-*.exe | Format-Table Name, Length
      - name: Try TUN with each
        shell: pwsh
        run: |
          $cfg = @'
          mixed-port: 7890
          external-controller: 127.0.0.1:9090
          log-level: info
          geodata-mode: false
          tun:
            enable: true
            stack: gvisor
            auto-route: false
            device: ApexProbe
          proxies: []
          rules:
            - MATCH,DIRECT
          '@
          foreach ($a in 'amd64', 'arm64') {
            "===== core-$a"
            $dir = "run-$a"; New-Item -ItemType Directory -Force $dir | Out-Null
            Set-Content "$dir\config.yaml" $cfg
            # 内核在自己旁边找 wintun.dll:放对应架构的那份
            Copy-Item "wt\wintun\bin\$a\wintun.dll" $dir
            Copy-Item "core-$a.exe" $dir
            $p = Start-Process "$dir\core-$a.exe" -ArgumentList "-d `"$((Resolve-Path $dir).Path)`"" -PassThru -RedirectStandardOutput "$dir\out.log" -RedirectStandardError "$dir\err.log"
            Start-Sleep -Seconds 8
            $nic = Get-NetAdapter -IncludeHidden -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'ApexProbe*' -or $_.InterfaceDescription -like '*Wintun*' }
            "进程还活着: $(-not $p.HasExited)"
            "建出的网卡: $(if ($nic) { ($nic | ForEach-Object { "$($_.Name) [$($_.InterfaceDescription)] $($_.Status)" }) -join '; ' } else { '无' })"
            "--- 内核日志(TUN 相关)"
            Get-Content "$dir\out.log", "$dir\err.log" -ErrorAction SilentlyContinue | Select-String -Pattern 'tun|wintun|TUN|error|fatal' | Select-Object -First 12 | ForEach-Object { "  $_" }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Start-Sleep -Seconds 3
          }
